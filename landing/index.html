<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oricade Arcade</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0a0a12;
        color: #f5f5f5;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main { text-align: center; padding: 2rem; }
      h1 { font-size: 2.5rem; margin-bottom: 2rem; }
      .games { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
      .games a {
        display: block;
        width: 220px;
        padding: 1.5rem;
        border-radius: 12px;
        background: #1a1a2e;
        color: inherit;
        text-decoration: none;
        border: 1px solid #333;
      }
      .games a:hover { border-color: #6cf; }
      .games h2 { margin: 0 0 0.5rem; }
      .games p { margin: 0; opacity: 0.7; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose your game</h1>
      <div class="games">
        <a href="./oricade/">
          <h2>OriCade</h2>
          <p>Play now</p>
        </a>
        <a href="./guardian/">
          <h2>Guardian of Japan</h2>
          <p>Coming soon</p>
        </a>
      </div>
    </main>
  </body>
</html>
